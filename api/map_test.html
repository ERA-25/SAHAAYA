<!DOCTYPE html>
<html>
<head>
    <title>Sahaaya Emergency Radius</title>

    <meta charset="UTF-8">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        #map {
            height: 500px;
            width: 100%;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            font-size: 16px;
        }

        #status {
            font-size: 18px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Sahaaya Emergency Radius</h1>

    <button onclick="startEmergency()">
        START EMERGENCY
    </button>

    <button onclick="expandRadius()">
        EXPAND SEARCH
    </button>

    <p id="status">
        Emergency not started.
    </p>

    <div id="map"></div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        // Create map
        const map = L.map("map").setView([20, 78], 5);

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);


        let emergencyMarker = null;
        let searchCircle = null;

        let currentRadius = 150;


        function startEmergency() {

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    map.setView(
                        [latitude, longitude],
                        16
                    );


                    emergencyMarker = L.marker([
                        latitude,
                        longitude
                    ])
                    .addTo(map)
                    .bindPopup(
                        "<b>🚨 Emergency</b>"
                    )
                    .openPopup();


                    drawRadius(
                        latitude,
                        longitude,
                        currentRadius
                    );

                },

                function() {

                    alert("Could not get your location.");

                }
            );
        }


        function drawRadius(
            latitude,
            longitude,
            radius
        ) {

            if (searchCircle) {
                map.removeLayer(searchCircle);
            }


            searchCircle = L.circle(
                [latitude, longitude],
                {
                    radius: radius,
                    color: "red",
                    fillOpacity: 0.15
                }
            ).addTo(map);


            document.getElementById("status").innerText =
                "Searching for helpers within " +
                radius +
                " metres.";
        }


        function expandRadius() {

            if (!emergencyMarker) {

                alert(
                    "Start the emergency first."
                );

                return;
            }


            if (currentRadius === 150) {

                currentRadius = 300;

            } else if (currentRadius === 300) {

                currentRadius = 500;

            } else if (currentRadius === 500) {

                currentRadius = 1000;

            } else {

                document.getElementById("status").innerText =
                    "No nearby helper found. Escalating emergency.";

                return;
            }


            const position =
                emergencyMarker.getLatLng();


            drawRadius(
                position.lat,
                position.lng,
                currentRadius
            );
        }

    </script>

</body>
</html>
